version: '3.8'

services:
  # --- SERVICE BACKEND ---
  backend:
    build: ./backend
    container_name: solana-bot-backend
    restart: always
    ports:
      - "8000:8000"
    # Mapping file agar data tidak hilang saat container restart
    volumes:
      - ./backend/solana_trades.json:/app/solana_trades.json
      - ./backend/solana_positions.json:/app/solana_positions.json
      - ./backend/paper_trading_state.json:/app/paper_trading_state.json
      - ./backend/logs:/app/logs
    # Environment variable (API Key, dll)
    env_file:
      - ./backend/.env

  # --- SERVICE FRONTEND ---
  frontend:
    build: ./frontend
    container_name: solana-bot-frontend
    restart: always
    ports:
      - "80:80"  # Akses VPS langsung tanpa port (http://ip-vps)
    depends_on:
      - backend